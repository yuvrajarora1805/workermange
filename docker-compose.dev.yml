services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "3015:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=workermanage
      - NODE_ENV=development
    depends_on:
      - db

  db:
    image: mariadb:latest
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=workermanage
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Uncomment to seed database on first run
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db_data:
